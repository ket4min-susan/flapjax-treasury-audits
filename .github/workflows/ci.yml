name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify BSC Receipt Cluster Forensic Dataset & Scripts
        run: |
          python -m py_compile verify_all_66_txs.py verify_funders_and_nonces.py
          python -c "import json; d=json.loads(open('verified_transfers.json', encoding='utf-8').read()); assert len(d)>0; print('Verified transfers:', len(d))"
